# Relevance, geography and topic keywords. Editable without code changes.
# Matching rules:
#   - English keywords: case-insensitive, whole-word.
#   - Telugu keywords: substring match (Telugu attaches suffixes, e.g. తెలంగాణలో),
#     after removing zero-width joiners (U+200C / U+200D).

relevance_keywords:
  en: [telangana, hyderabad, secunderabad, cyberabad, ghmc, hmda, hmwssb, tgsrtc, tsrtc,
       revanth reddy, ktr, kcr, harish rao, brs, trs, bhatti vikramarka, kavitha,
       musi, osmania university, kaleshwaram]
  te: [తెలంగాణ, హైదరాబాద్, సికింద్రాబాద్, రేవంత్, కేటీఆర్, కేసీఆర్, హరీశ్, బీఆర్ఎస్, జీహెచ్ఎంసీ,
       భట్టి, కవిత, మూసీ, కాళేశ్వరం]

# Scope: POLITICAL content only (politics, government, policy, elections, governance).
# An item is dropped at collection time when it is marked out of scope (by the publisher's
# section/tag or a keyword below) AND its title/excerpt contains none of political_keywords.
# So "Actor joins BJP" or "GO on cinema ticket prices" stay in; a match report does not.
# Items that pass this cheap filter are judged again by the AI (political_relevant).
scope:
  # Publisher feed tags or URL path sections (case-insensitive, whole tag / whole path segment).
  exclude_sections: [entertainment, sport, sports, cricket, football, tennis, badminton, kabaddi,
                     cinema, movies, movie, movie reviews, movie-reviews, tollywood, bollywood,
                     kollywood, television, tv, ott, web series, music, lifestyle, fashion, food,
                     travel, astrology, horoscope, spirituality, devotional, health and fitness,
                     gadgets, technology, auto, automobile, science, gallery, photos, viral, trending-viral]
  exclude_keywords:
    en: [cricket, ipl, t20, odi, wicket, test match, world cup, football, isl, badminton, tennis,
         kabaddi, olympics, olympian, box office, movie, film review, trailer, teaser, first look,
         tollywood, bollywood, ott, web series, actor, actress, heroine, celebrity, bigg boss,
         music director, audio launch, pre-release, horoscope, recipe, fashion, smartphone, gadget]
    te: [సినిమా, మూవీ, ట్రైలర్, టీజర్, హీరోయిన్, బాక్సాఫీస్, టాలీవుడ్, బాలీవుడ్, ఓటీటీ, క్రికెట్,
         ఐపీఎల్, బిగ్ బాస్, రాశి ఫలాలు, రాశిఫలాలు, దినఫలాలు, వంటకం]
  # Any of these keeps an item in scope even if it matched an exclusion above. Also used by the
  # no-AI fallback: a story with none of these is treated as non-political.
  political_keywords:
  # Avoid words with common non-political senses ("party", "budget", "strike", "campaign", "go").
    en: [government, govt, minister, ministry, cabinet, chief minister, deputy cm, assembly,
         legislature, legislative council, mla, mlas, mlc, mp, mps, lok sabha, rajya sabha, governor,
         congress, bjp, brs, trs, aimim, tdp, ysrcp, cpi, cpi(m), bsp, jana sena, opposition,
         election, elections, bypoll, voter, voters, election campaign, manifesto,
         policy, policies, scheme, schemes, welfare, six guarantees, government order, ordinance,
         high court, hc, supreme court, election commission, electoral roll, electoral rolls,
         special intensive revision, acb, ngt, hydraa, department, officials, ias, ips, legislator,
         collector, municipal, corporator,
         ghmc, panchayat, sarpanch, zptc, mptc, mayor, protest, dharna, agitation, bandh,
         revanth reddy, ktr, kcr, harish rao, bhatti vikramarka, kishan reddy, bandi sanjay,
         owaisi, rahul gandhi, modi, union government, central government, ticket prices, ticket rates]
    te: [ప్రభుత్వ, మంత్రి, సీఎం, ముఖ్యమంత్రి, అసెంబ్లీ, శాసన, ఎమ్మెల్యే, ఎమ్మెల్సీ, ఎంపీ, గవర్నర్,
         కాంగ్రెస్, బీజేపీ, బీఆర్ఎస్, ఎంఐఎం, ప్రతిపక్ష, ఎన్నిక, ఓటర్, మేనిఫెస్టో,
         పథకం, సంక్షేమ, గ్యారంటీ, జీవో, హైకోర్టు, సుప్రీంకోర్టు, కలెక్టర్, మున్సిపల్,
         కార్పొరేట, పంచాయతీ, సర్పంచ్, మేయర్, ధర్నా, నిరసన, బంద్,
         రేవంత్, కేటీఆర్, కేసీఆర్, హరీశ్, భట్టి, కిషన్ రెడ్డి, బండి సంజయ్, ఒవైసీ, రాహుల్ గాంధీ, మోదీ]

