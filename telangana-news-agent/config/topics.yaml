# Used by the no-Gemini fallback to guess priority. Gemini decides when available.
priority_keywords:
  critical:
    en: [stampede, explosion, blast, building collapse, dam breach, cyclone warning, red alert,
         curfew, riot, terror, death toll, killed, evacuat]
    te: [తొక్కిసలాట, పేలుడు, కూలి, రెడ్ అలర్ట్, కర్ఫ్యూ, మృతి]
  high:
    en: [orange alert, flood, heavy rain, cabinet decision, resign, arrested, suspended, ordinance,
         strike, bandh, protest, high court orders, outage]
    te: [ఆరెంజ్ అలర్ట్, వరద, భారీ వర్షం, రాజీనామా, అరెస్టు, బంద్, ధర్నా, సమ్మె]

# Stories matching these never auto-send an alert (they go to the review path).
politically_sensitive_keywords:
  en: [communal, caste, religion, allegation, alleged, accused, scam, corruption, defamation,
       election commission, vote, defection, rumour, viral video, fake news]
  te: [ఆరోపణ, కుంభకోణం, అవినీతి, కులం, మతం, ఫిరాయింపు]
