# Category keywords: used only by the no-Gemini fallback classifier and as hints.
# Category values map to digest sections in pipeline.yaml.
categories:
  government_politics:
    en: [government, minister, cabinet, assembly, legislature, chief minister, cm, congress, bjp, brs,
         aimim, election, mla, mp, policy, scheme, department, governor, high court, cabinet meeting, party]
    te: [ప్రభుత్వం, మంత్రి, సీఎం, ముఖ్యమంత్రి, అసెంబ్లీ, ఎన్నిక, ఎమ్మెల్యే, కాంగ్రెస్, బీజేపీ, పథకం, హైకోర్టు]
  public_issues:
    en: [water, power, electricity, traffic, metro, road, flood, rain, weather, police, accident, fire,
         hospital, health, school, education, university, students, farmers, civic, drainage, safety,
         crime, temperature, cyclone, outage]
    te: [నీరు, విద్యుత్, ట్రాఫిక్, మెట్రో, రోడ్డు, వరద, వర్షం, పోలీసు, ప్రమాదం, ఆసుపత్రి, విద్యార్థు, రైతు]
