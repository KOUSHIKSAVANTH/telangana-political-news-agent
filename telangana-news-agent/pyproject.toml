[project]
name = "telangana-news-agent"
version = "0.1.0"
description = "Email-only Telangana political news monitoring agent (RSS + Groq/Gemini + Gmail)"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "google-genai>=1.0",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "google-auth-oauthlib>=1.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
